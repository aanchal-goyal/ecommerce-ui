<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>ShopX</h1>
  <div id="cart">
    🛒
    <span id="count">0</span>
  </div>  
</header>

<div class="controls">
    <input type="text" id="search" placeholder="Search products...">
    <select id="filter">
      <option value="all">All</option>
      <option value="headphones">Headphones</option>
      <option value="shoes">Shoes</option>
      <option value="watch">Smart Watch</option>
      <option value="phone">Smart Phone</option>
    </select>
  </div>    

  <section class="products" id="product-list">

    <!-- Headphones variations -->
    <div class="card" data-name="Headphones Black" data-price="999" data-category="headphones">
      <img src="product images/headphone-black.jpeg" alt="Headphones Black">
      <h3>Headphones (Black)</h3>
      <p>₹999</p>
      <button>Add to Cart</button>
    </div>
  
    <div class="card" data-name="Headphones White" data-price="1099" data-category="headphones">
      <img src="product images/headphone-white.jpeg" alt="Headphones White">
      <h3>Headphones (White)</h3>
      <p>₹1099</p>
      <button>Add to Cart</button>
    </div>
  
    <div class="card" data-name="Headphones Pro" data-price="1499" data-category="headphones">
      <img src="product images/headphone-pro.jpeg" alt="Headphones Pro">
      <h3>Headphones Pro</h3>
      <p>₹1499</p>
      <button>Add to Cart</button>
    </div>
  
    <!-- Shoes variations -->
    <div class="card" data-name="Running Shoes" data-price="1499" data-category="shoes">
      <img src="product images/running-shoes.jpeg" alt="Running Shoes">
      <h3>Running Shoes</h3>
      <p>₹1499</p>
      <button>Add to Cart</button>
    </div>
  
    <div class="card" data-name="Casual Shoes" data-price="1299" data-category="shoes">
      <img src="product images/casual-shoes.jpeg" alt="Casual Shoes">
      <h3>Casual Shoes</h3>
      <p>₹1299</p>
      <button>Add to Cart</button>
    </div>
  
    <div class="card" data-name="Sports Shoes" data-price="1699" data-category="shoes">
      <img src="product images/sports-shoes.jpeg" alt="Sports Shoes">
      <h3>Sports Shoes</h3>
      <p>₹1699</p>
      <button>Add to Cart</button>
    </div>
  
    <!-- Smart Watch -->
    <div class="card" data-name="Smart Watch Basic" data-price="1999" data-category="watch">
      <img src="product images/smart-watch.jpeg" alt="Smart Watch Basic">
      <h3>Smart Watch Basic</h3>
      <p>₹1999</p>
      <button>Add to Cart</button>
    </div>
  
    <!-- Smart Phone variations -->
    <div class="card" data-name="Smart Phone X" data-price="8999" data-category="phone">
      <img src="product images/smart-phone-x.jpeg" alt="Smart Phone X">
      <h3>Smart Phone X</h3>
      <p>₹8999</p>
      <button>Add to Cart</button>
    </div>
  
    <div class="card" data-name="Smart Phone Pro" data-price="12999" data-category="phone">
      <img src="product images/smart-phone-pro.jpeg" alt="Smart Phone Pro">
      <h3>Smart Phone Pro</h3>
      <p>₹12999</p>
      <button>Add to Cart</button>
    </div>
  
    <div class="card" data-name="Smart Phone Lite" data-price="6999" data-category="phone">
      <img src="product images/smart-phone-lite.jpeg" alt="Smart Phone Lite">
      <h3>Smart Phone Lite</h3>
      <p>₹6999</p>
      <button>Add to Cart</button>
    </div>
  
  </section>    

<div id="cart-panel">
  <h2>Your Cart</h2>
  <ul id="cart-items"></ul>
  <p id="total"></p>
  <button id="close-cart">Close</button>
</div>
  
<!-- Chatbot Button -->
<div id="chatbot-btn">💬</div>

<!-- Chatbot Window -->
<div id="chatbot">
  <div id="chat-header">
    ShopX Assistant
    <span id="close-chat">✖</span>
  </div>

  <div id="chat-body"></div>

  <div id="chat-input-box">
    <input type="text" id="chat-input" placeholder="Ask something...">
    <button id="send-btn">Send</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
